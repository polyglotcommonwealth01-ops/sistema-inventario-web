# ========================================================
# CONFIGURACIÓN SISTEMA DE INVENTARIO - SENA
# Optimizado para Render (Cloud) y Desarrollo Local
# ========================================================

# Puerto dinámico asignado por Render (en local por defecto 8080)
server.port=${PORT:8080}

# Base de datos:
# Por defecto usa H2 persistente en archivo con sintaxis MySQL para que Render funcione al 100% de inmediato.
# Si se configuran variables en Render (ej. MySQL remoto), se usará esa conexión automáticamente.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/inventariodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# Consola H2 para consultar datos vía web (/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
