# Perfil Cloud / Render sin necesidad de base de datos MySQL externa
server.port=${PORT:8080}

# Base de datos embebida persistente en archivo con sintaxis compatible MySQL
spring.datasource.url=jdbc:h2:file:./data/inventariodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
